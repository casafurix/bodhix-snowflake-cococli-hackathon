spec:
  containers:
    - name: trialops
      image: /ctops_hackathon/app/trialops_repository/trialops:latest
      env:
        TRIALOPS_DATA_BACKEND: snowflake
        SNOWFLAKE_WAREHOUSE: CTOPS_WH
        SNOWFLAKE_DATABASE: CTOPS_HACKATHON
        SNOWFLAKE_SCHEMA: APP
        PORT: "8000"
      readinessProbe:
        port: 8000
        path: /api/health
  endpoints:
    - name: app
      port: 8000
      protocol: HTTP
      public: true
