[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trial-operations-copilot"
version = "0.1.0"
description = "Snowflake-native ATLAS clinical trial operations copilot"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "snowflake-connector-python[secure-local-storage]>=3.18,<5",
]

[project.optional-dependencies]
snowpark = ["snowflake-snowpark-python>=1.31,<2"]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
